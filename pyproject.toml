[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "behavex"
version = "0.1.0"
description = "Behavioral analysis and annotation package"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "pandas",
    "torch",
    "scikit-learn",
    "matplotlib",
    "plotly",
    "pyyaml",
    "joblib",
    "tqdm",
    "PyQt5",
    "tensorboard",
    "opencv-python",
    "openpyxl",
    "xlrd",
    "hmmlearn>=0.3.3",
    "h5py",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "flake8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml"]

[tool.uv]
dev-dependencies = [
    "pytest",
    "black",
    "flake8",
]
